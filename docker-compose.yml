services:
  backend:
    image: node:24-alpine
    container_name: backend_canis_world
    working_dir: /app
    env_file:
      - ./.env
    environment:
      PORT: 7344
      MONGODB_CONNECT: mongodb://127.0.0.1:27017/canis_world
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: ${CANIS_BACKEND_NETWORK_MODE:-host}
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
      - ./public:/app/public
    command: sh -c "if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi && npm start"
    ports:
      - "7344:7344"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7344/readyz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  backend_node_modules:
