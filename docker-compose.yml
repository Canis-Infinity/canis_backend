services:
  backend:
    image: node:24-alpine
    container_name: backend_canis_world
    working_dir: /app
    env_file:
      - ./.env
    environment:
      PORT: 7344
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
      - ./public:/app/public
    command: sh -c "if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi && npm start"
    ports:
      - "7344:7344"
    restart: unless-stopped

volumes:
  backend_node_modules:
